<main>
  <section class="login-card" aria-labelledby="titulo-pagina">
    <div class="titulo">
      <div class="titulo-texto">
        <p class="etapa">De volta ao NeuroWALLet</p>
        <h1 id="titulo-pagina">Não foi possível conectar sua conta</h1>
      </div>
      <img class="logo" src="images/Logo.png" alt="Logo NeuroWallet" />
    </div>

    <div class="status" role="alert">
      <span class="icone-status" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6v7" />
          <path d="M12 17.5h.01" />
        </svg>
      </span>
      <p class="status-texto">Nenhum dado foi compartilhado.</p>
      <p class="status-detalhe">Você pode tentar de novo quando quiser.</p>
    </div>

    <div class="button-login">
      <a class="botao" routerLink="/banco">Tentar novamente</a>
      <div class="voltinha">
        <a routerLink="/login">Voltar</a>
      </div>
    </div>
  </section>
</main>
