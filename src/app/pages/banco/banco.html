<main>
  <section class="login-card">
    <h1>Conecte sua conta bancária</h1>
    <p>
      Escolha sua instituição no ambiente seguro da Pluggy e autorize a leitura do seu histórico.
      Não fazemos pagamentos ou transferências.
    </p>
    @if (erro()) {
      <p role="alert">{{ erro() }}</p>
    }
    <div class="button-login">
      <button (click)="continuar()" [disabled]="enviando()">
        {{ enviando() ? 'Abrindo conexão...' : 'Conectar conta' }}</button
      ><a routerLink="/inicio">Voltar ao início</a>
    </div>
  </section>
</main>
