<main> 
    <div class="login-card">
        
         <div class="titulo">
            <div class="titulo-texto">
            <h1>Bem vindo ao NeuroWallet</h1>
            <p class="subtitulo">Comece sua jornada no NeuroWALLet</p>
            </div>
            <img src="./images/Logo.png" alt="logo NeuroWallet" />
            </div>

        <form class="form">
            <div class="input">
                <label>Nome completo</label>
                <input type="text" placeholder="Digite seu nome completo" />
                <i class="bx bxs-user-circle"></i>
            </div>
            
            <div class="input">
                <label>E-Mail</label>
                <input type="email" placeholder="Digite seu e-mail" />
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha" />
                <i class="bx bx-key"></i>
                <p>Use 8 caracteres ou mais</p>
            </div>

            <div class="input">
                <label>Confirmar senha</label>
                <input type="password" placeholder="Confirme sua senha" />
                <i class="bx bx-key"></i>
            </div>

            <div class="opcoes">
        <label class="termos">
          <input type="checkbox" formControlName="lembrar" />
          <span>Li e aceito os <a href="#">Termos de Uso</a> e estou
                ciente da <br><a href="#">Política de Privacidade</a>.</span>
        </label>
      </div>

        <div class="button-login">
            <button type="submit">
            Criar conta
            </button>
            <p>Já possui uma conta? <a href="/login">Faça login</a></p>
        </div>

    
    </form>
     <footer class="login-footer">

      <p>
        Protegido por reCAPTCHA
        <a href="#">Privacidade</a> e
        <a href="#">Termos do Google</a>.
      </p>

      <p>
        Dados tratados conforme a LGPD, veja nossa política.
      </p>

      <div class="footer-links">
        <a href="#">Política de Privacidade</a>
        <a href="#">Termos de Uso</a>
      </div>
    </footer>
  </div>
</main>
