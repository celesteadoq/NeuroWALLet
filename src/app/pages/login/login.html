<main> 
    <div class="login-card">
        
         <div class="titulo">
            <div class="titulo-texto">
            <h1>Bem vindo ao NeuroWallet</h1>
            <p class="subtitulo">Prazer em vê-lo</p>
            </div>
            <img src="./images/Logo.png" alt="logo NeuroWallet" />
            </div>

        <form class="form">
            <div class="input">
                <label>E-Mail</label>
                <input type="text" placeholder="Digite seu e-mail" />
                <i class="bx bxs-user-circle"></i>
            </div>
            
            <div class="input">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha" />
                <i class="bx bx-key"></i>
            </div>

        <div class="button-login">
            <button type="submit">
            login
            </button>
        </div>

    <div class="opcoes">
        <label class="lembrar">
          <input type="checkbox" formControlName="lembrar" />
          <span>Lembrar de mim</span>
        </label>
        <a class="link" routerLink="/recuperar-senha">Esqueci minha senha</a>
      </div>

        <div class="button-criar">
            <p class="subtitulo">ainda não tem uma conta?</p>
            <a href="./cadastro">
                <button type="button">
                    Criar conta
                    <i class="bx bx-right-arrow-alt"></i>
                </button>
            </a>
        </div>
    </form>
     <footer class="login-footer">

      <p>
        Protegido por reCAPTCHA
        <a href="https://policies.google.com/privacy?hl=pt&client_theme=dark">Privacidade</a> e
        <a href="https://policies.google.com/terms?hl=pt&client_theme=dark">Termos do Google</a>.
      </p>

      <p>
        Dados tratados conforme a LGPD, veja nossa política.
      </p>

      <div class="footer-links">
        <a href="#">Política de Privacidade</a>
        <a href="#">Termos de Uso</a>
      </div>
    </footer>
  </div>
</main>
